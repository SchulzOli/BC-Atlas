name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bc-openbridge/package-lock.json
            bc-mcp/package-lock.json

      - name: Gateway – install, verify signatures, typecheck, test
        working-directory: bc-openbridge
        run: |
          npm ci
          npm audit signatures
          npm run typecheck
          npm test

      - name: MCP server – install, typecheck, test (uses the gateway next to it)
        working-directory: bc-mcp
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: SBOM (CycloneDX)
        working-directory: bc-openbridge
        run: npm run sbom > ../sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bc-openbridge:ci bc-openbridge
      - name: Smoke test (config validation must fail closed)
        run: |
          if docker run --rm bc-openbridge:ci; then echo "expected startup to fail without config"; exit 1; fi
