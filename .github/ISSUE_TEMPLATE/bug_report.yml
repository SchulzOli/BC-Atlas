name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove proprietary data from examples and use the private security process for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: BC Atlas version
      placeholder: "0.5.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22, Windows 11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and minimal AL input
      description: Include the exact command and the smallest non-proprietary input that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain confidential source code or security-sensitive details.
          required: true
