name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Confirm requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=commonjs <<'NODE'
          const pkg = require("./package.json");
          if (pkg.version !== process.env.EXPECTED_VERSION) {
            console.error(`Requested ${process.env.EXPECTED_VERSION}, but package.json contains ${pkg.version}.`);
            process.exit(1);
          }
          NODE

      - name: Confirm version is unpublished
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_NAME=$(node --input-type=commonjs -p "require('./package.json').name")
          OUTPUT=$(npm view "${PACKAGE_NAME}@${EXPECTED_VERSION}" version 2>&1) && {
            echo "${PACKAGE_NAME}@${EXPECTED_VERSION} is already published."
            exit 1
          }
          echo "$OUTPUT" | grep -q "E404" || {
            echo "$OUTPUT"
            echo "Could not verify that the version is unpublished."
            exit 1
          }

      - name: Validate package
        run: |
          npm run check
          npm test
          npm pack --dry-run

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          # Release notes: the CHANGELOG.md section of this version.
          awk -v version="$VERSION" '
            /^## / { if (found) exit; found = index($0, "## " version " ") == 1 || $0 == "## " version; next }
            found
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          PRERELEASE=""
          [ "$DIST_TAG" = "latest" ] || PRERELEASE="--prerelease"
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release-notes.md $PRERELEASE
