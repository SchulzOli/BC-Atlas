# Publishes a released version of the VS Code extension to Open VSX (VSCodium,
# Cursor, and other editors): the .vsix attached to its GitHub release, so
# exactly what the Visual Studio Marketplace received. For a release whose
# Open VSX step was skipped because OVSX_PAT was not set yet.
name: Open VSX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version, such as 0.28.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  openvsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the extension of the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "bc-atlas-${VERSION}.vsix" --output bc-atlas.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error title=Open VSX::The secret OVSX_PAT is not set. Create a token on open-vsx.org (and the SchulzOli namespace), then add it as a repository secret."
            exit 1
          fi
          npx --yes ovsx@1.2.0 publish bc-atlas.vsix
