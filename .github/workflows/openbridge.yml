name: OpenBridge

on:
  pull_request:
    paths:
      - "openbridge/**"
      - ".github/workflows/openbridge.yml"
  push:
    branches: [main]
    paths:
      - "openbridge/**"
      - ".github/workflows/openbridge.yml"

permissions:
  contents: read

concurrency:
  group: openbridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            openbridge/bc-openbridge/package-lock.json
            openbridge/bc-mcp/package-lock.json

      - name: Gateway – install, verify signatures, typecheck, test
        working-directory: openbridge/bc-openbridge
        run: |
          npm ci
          npm audit signatures
          npm run typecheck
          npm test

      - name: MCP server – install, typecheck, test (uses the gateway next to it)
        working-directory: openbridge/bc-mcp
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: SBOM (CycloneDX)
        working-directory: openbridge/bc-openbridge
        run: npm run sbom > ../sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: openbridge-sbom
          path: openbridge/sbom.cdx.json

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bc-openbridge:ci openbridge/bc-openbridge
      - name: Smoke test (config validation must fail closed)
        run: |
          if docker run --rm bc-openbridge:ci; then echo "expected startup to fail without config"; exit 1; fi
