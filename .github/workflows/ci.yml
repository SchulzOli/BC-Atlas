name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, OS-independent gate. The test matrix starts only when it passes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated examples are current
        run: |
          npm run examples
          git diff --exit-code -- examples/output examples/report examples/docs
      - run: npm pack --dry-run
      - name: Documentation website builds without dead links
        run: npm run site:build

  test:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node src/cli.js --help
          node src/cli.js graph test/fixtures --view project --output dist/architecture.d2
          node src/cli.js inspect test/fixtures --output dist/model.json
          node src/cli.js check examples/warehouse-app

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the BC Atlas GitHub Action from this checkout
        id: atlas
        uses: ./
        with:
          path: examples/warehouse-app
          tasks: check,report
      - name: Action outputs
        env:
          OUTPUTS: ${{ steps.atlas.outputs.outputs }}
          PASSED: ${{ steps.atlas.outputs.passed }}
        run: |
          test "$PASSED" = "true"
          test "$OUTPUTS" = "examples/warehouse-app/docs/atlas"
          test -f examples/warehouse-app/docs/atlas/README.md

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bc-atlas:test .
      - run: docker run --rm bc-atlas:test --version
      - run: docker run --rm -v "$PWD/examples:/workspace:ro" bc-atlas:test check /workspace/warehouse-app
