name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, OS-independent gate. The test matrix starts only when it passes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated examples are current
        run: |
          npm run examples
          git diff --exit-code -- examples/output examples/report examples/docs examples/explorer
      - run: npm pack --dry-run
      - name: Documentation website builds without dead links
        run: npm run site:build

  # The VS Code extension: its tests and a .vsix with the engine inside.
  vscode:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package -- --out bc-atlas.vsix
        working-directory: vscode
      - name: Test the packaged extension (bundled engine)
        working-directory: vscode
        run: |
          unzip -q bc-atlas.vsix -d .packaged
          BCA_EXTENSION_MAIN=.packaged/extension/dist/extension.js npm test
      - uses: actions/upload-artifact@v4
        with:
          name: bc-atlas-vsix
          path: vscode/bc-atlas.vsix

  test:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node src/cli.js --help
          node src/cli.js export test/fixtures --view project --format d2 --output dist/architecture.d2
          node src/cli.js export test/fixtures --view project --format json --output dist/model.json
          node src/cli.js export examples/warehouse-app --output dist/atlas.html
          node src/cli.js check examples/warehouse-app

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the BC Atlas GitHub Action from this checkout
        id: atlas
        uses: ./
        with:
          path: examples/warehouse-app
          tasks: check,report
      - name: Action outputs
        env:
          OUTPUTS: ${{ steps.atlas.outputs.outputs }}
          PASSED: ${{ steps.atlas.outputs.passed }}
        run: |
          test "$PASSED" = "true"
          test "$OUTPUTS" = "examples/warehouse-app/docs/atlas"
          test -f examples/warehouse-app/docs/atlas/README.md

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bc-atlas:test .
      - run: docker run --rm bc-atlas:test --version
      - run: docker run --rm -v "$PWD/examples:/workspace:ro" bc-atlas:test check /workspace/warehouse-app
