name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, OS-independent gate. The test matrix starts only when it passes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated examples are current
        run: |
          npm run examples
          git diff --exit-code -- examples/output examples/docs examples/layers docs/generated/images
      - run: npm pack --dry-run
      - name: Documentation website builds without dead links
        run: npm run site:build

  # The VS Code extension: its tests and a .vsix with the engine inside.
  vscode:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package -- --out bc-atlas.vsix
        working-directory: vscode
      - name: Test the packaged extension (bundled engine)
        working-directory: vscode
        run: |
          unzip -q bc-atlas.vsix -d .packaged
          BCA_EXTENSION_MAIN=.packaged/extension/dist/extension.js npm test
      - uses: actions/upload-artifact@v7
        with:
          name: bc-atlas-vsix
          path: vscode/bc-atlas.vsix

  test:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          # This one also opens the exported view in a browser (test/app.test.js).
          - { os: ubuntu-latest, node: 24, browser: true }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Browser for the test of the view
        if: matrix.browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm test
        env:
          BCA_BROWSER_TEST: ${{ matrix.browser && '1' || '' }}
      - name: CLI smoke test
        shell: bash
        run: |
          node src/cli.js --help
          node src/cli.js view test/fixtures --lens overview --output dist/overview.svg
          node src/cli.js view test/fixtures --format json --output dist/atlas.json
          node src/cli.js export examples/warehouse-app --output dist/atlas.html
          node src/cli.js check examples/warehouse-app

  # Time and peak memory on a synthetic app (scripts/benchmark.js). On a pull
  # request the base is measured on the same machine, in the same job, and a
  # clear regression fails the build; runners differ too much for fixed limits.
  performance:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: This change
        run: node scripts/benchmark.js --json head.json
      - name: The base branch, on the same machine
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach ../base "origin/${{ github.base_ref }}"
          (cd ../base && npm ci --ignore-scripts --no-audit --no-fund)
          node scripts/benchmark.js --tree ../base --json base.json
      - name: No regression
        if: github.event_name == 'pull_request'
        run: node scripts/benchmark.js --compare base.json head.json

  # BC Atlas on a real project (scripts/bcapps.js): Microsoft's BCApps at a
  # pinned commit. The share of resolved references and the UI tests that
  # become a guide have floors; raise them as BC Atlas gets better.
  bcapps:
    needs: check
    runs-on: ubuntu-latest
    env:
      BCAPPS_COMMIT: 651fa482a8eda31b59fd2ace52bebe27330c5f0d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: BCApps at the pinned commit
        run: |
          git init -q ../bcapps
          cd ../bcapps
          git remote add origin https://github.com/microsoft/BCApps.git
          git sparse-checkout set "src/System Application" "src/Business Foundation" "src/Tools/Test Framework"
          git fetch -q --depth 1 --filter=blob:none origin "$BCAPPS_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Resolution and guides above their floors
        run: node scripts/bcapps.js ../bcapps/src --json bcapps.json | tee -a "$GITHUB_STEP_SUMMARY"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bc-atlas:test .
      - run: docker run --rm bc-atlas:test --version
      - run: docker run --rm -v "$PWD/examples:/workspace:ro" bc-atlas:test check /workspace/warehouse-app
