name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node src/cli.js --help
          node src/cli.js graph test/fixtures --view project --output dist/architecture.d2
          node src/cli.js inspect test/fixtures --output dist/model.json
          node src/cli.js check examples/warehouse-app
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        name: Generated examples are current
        run: |
          npm run examples
          git diff --exit-code -- examples/output examples/report
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bc-atlas:test .
      - run: docker run --rm bc-atlas:test --version
      - run: docker run --rm -v "$PWD/examples:/workspace:ro" bc-atlas:test check /workspace/warehouse-app
