name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact vscode/package.json version to publish
        required: true
        type: string

permissions:
  contents: read
  # The job signs in to Microsoft Entra ID with GitHub's OIDC token, so no
  # Marketplace token is stored in GitHub.
  id-token: write

concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The federated credential of the Entra app trusts this environment.
    environment: marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=commonjs <<'NODE'
          const pkg = require("./vscode/package.json");
          if (pkg.version !== process.env.EXPECTED_VERSION) {
            console.error(`Requested ${process.env.EXPECTED_VERSION}, but vscode/package.json contains ${pkg.version}.`);
            process.exit(1);
          }
          NODE

      - run: npm ci
      - run: npm ci
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package -- --out bc-atlas.vsix
        working-directory: vscode

      # Microsoft Entra ID instead of a personal access token: Azure DevOps
      # retires global PATs, the only kind the Marketplace accepted, on
      # December 1, 2026. The app needs no Azure subscription.
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Check access to the publisher
        working-directory: vscode
        run: npx vsce verify-pat --azure-credential "$(node -p 'require("./package.json").publisher')"

      - name: Publish to the Visual Studio Marketplace
        working-directory: vscode
        run: npx vsce publish --azure-credential --packagePath bc-atlas.vsix

      # Open VSX serves VSCodium, Cursor, and other editors; skipped without a token.
      - name: Publish to Open VSX
        working-directory: vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT is not set; skipping Open VSX."; exit 0; fi
          npx --yes ovsx@1.2.0 publish bc-atlas.vsix
