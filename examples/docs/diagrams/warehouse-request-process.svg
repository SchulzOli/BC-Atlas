<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 176" width="1008" height="176" role="img" aria-label="Process an existing warehouse request from the request list" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Process an existing warehouse request from the request list</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow-Process_warehouse-request-process" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#5b6470"/></marker></defs>
<polyline points="60,68 116,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_warehouse-request-process)"/>
<polyline points="256,68 312,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_warehouse-request-process)"/>
<polyline points="452,68 508,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_warehouse-request-process)"/>
<polyline points="648,68 704,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_warehouse-request-process)"/>
<polyline points="844,68 900,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_warehouse-request-process)"/>
<g class="bpmn-start"><circle cx="42" cy="68" r="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/></g>
<g class="bpmn-task"><title>Choose the 🔍 icon, enter Warehouse Requests, and then choose the related link.</title><rect x="116" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(123 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="186" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="186" y="63.5">Open Warehouse</tspan><tspan x="186" y="78.5">Requests</tspan></text></g>
<g class="bpmn-task"><title>Select the record you want to work with.</title><rect x="312" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(319 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="382" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="382" y="71.0">Select the record</tspan></text></g>
<g class="bpmn-task"><title>Choose the Process action.</title><rect x="508" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(515 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="578" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="578" y="71.0">Choose Process</tspan></text></g>
<g class="bpmn-task"><title>Close the Warehouse Requests page. Business Central saves your changes.</title><rect x="704" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(711 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="774" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="774" y="63.5">Close Warehouse</tspan><tspan x="774" y="78.5">Requests</tspan></text></g>
<g class="bpmn-end"><circle cx="918" cy="68" r="18" fill="#fdecea" stroke="#c62828" stroke-width="3.5"/><text x="918" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle" dominant-baseline="middle"><tspan x="918" y="96.0">The warehouse request</tspan><tspan x="918" y="109.8">is marked as</tspan><tspan x="918" y="123.5">processed.</tspan></text></g>
</svg>
