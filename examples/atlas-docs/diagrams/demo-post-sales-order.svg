<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 308" width="1216" height="308" role="img" aria-label="Create a new Sales Order" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Create a new Sales Order</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow-Process_demo-post-sales-order" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#5b6470"/></marker></defs>
<polyline points="112,68 220,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="360,68 416,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="556,68 612,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="752,68 808,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="948,68 1004,68" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="1144,68 1172,68 1172,146 94,146 94,164" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="164,200 272,200" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="308,200 416,200" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<polyline points="556,200 664,200" fill="none" stroke="#5b6470" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow-Process_demo-post-sales-order)"/>
<g class="bpmn-start"><circle cx="94" cy="68" r="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/></g>
<g class="bpmn-task"><title>Choose the 🔍 icon, enter Sales Order List, and then choose the related link.</title><rect x="220" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(227 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="290" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="290" y="63.5">Open Sales Order</tspan><tspan x="290" y="78.5">List</tspan></text></g>
<g class="bpmn-task"><title>Choose the 🔍 icon, enter Sales Order, and then choose the related link. Choose New to create a record.</title><rect x="416" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(423 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="486" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="486" y="71.0">Create Sales Order</tspan></text></g>
<g class="bpmn-task"><title>In the Sell-to Customer Name field, enter a value, for example Adatum Corporation.</title><rect x="612" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(619 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="682" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="682" y="63.5">Enter Sell-to</tspan><tspan x="682" y="78.5">Customer Name</tspan></text></g>
<g class="bpmn-task"><title>In the Lines section, in the Type field, enter a value, for example Item.</title><rect x="808" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(815 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="878" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="878" y="71.0">Lines: Enter Type</tspan></text></g>
<g class="bpmn-task"><title>In the Lines section, in the No. field, enter a value, for example 1896-S.</title><rect x="1004" y="32" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(1011 38)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="1074" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="1074" y="71.0">Lines: Enter No.</tspan></text></g>
<g class="bpmn-task"><title>In the Lines section, in the Quantity field, enter a value, for example 1.</title><rect x="24" y="164" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(31 170)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="94" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="94" y="195.5">Lines: Enter</tspan><tspan x="94" y="210.5">Quantity</tspan></text></g>
<g class="bpmn-event"><circle cx="290" cy="200" r="18" fill="#e8f1fd" stroke="#0b62d6" stroke-width="1.6"/><circle cx="290" cy="200" r="14" fill="none" stroke="#0b62d6" stroke-width="1.2"/><text x="290" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle" dominant-baseline="middle"><tspan x="290" y="228.0">Business Central</tspan><tspan x="290" y="241.8">saves: Sales Header:</tspan><tspan x="290" y="255.5">1x insert;…</tspan></text></g>
<g class="bpmn-task"><title>Choose the Post action.</title><rect x="416" y="164" width="140" height="72" rx="10" fill="#eef4fd" stroke="#0b62d6" stroke-width="1.6"/><g transform="translate(423 170)" fill="none" stroke="#0b62d6" stroke-width="1.2"><circle cx="7" cy="5" r="3.2"/><path d="M1 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></g><text x="486" font-size="12" font-weight="400" fill="#1b1f24" text-anchor="middle" dominant-baseline="middle"><tspan x="486" y="203.0">Choose Post</tspan></text></g>
<g class="bpmn-end"><circle cx="682" cy="200" r="18" fill="#fdecea" stroke="#c62828" stroke-width="3.5"/><text x="682" font-size="11" font-weight="400" fill="#5b6470" text-anchor="middle" dominant-baseline="middle"><tspan x="682" y="228.0">The data changes</tspan><tspan x="682" y="241.8">exactly as recorded</tspan><tspan x="682" y="255.5">(net records…</tspan></text></g>
</svg>
